<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Explorer</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Navbar styling */
        .navbar {
            background-color: #0077cc;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 999;
        }

        .navbar-links {
            display: flex;
            gap: 15px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .search-bar {
            display: flex;
            gap: 10px;
        }

        .search-bar input[type="text"] {
            padding: 5px;
        }

        .search-bar button {
            padding: 5px 10px;
            cursor: pointer;
        }

        .social-icons {
            display: flex;
            gap: 10px;
            margin-left: 20px;
        }

        .social-icons a {
            color: white;
            font-size: 18px;
        }

        .home-section {
            background-image: url('background.jpg'); /* Đổi thành đường dẫn ảnh thật */
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            color: white;
            padding-top: 80px; /* Đẩy nội dung xuống dưới navbar */
        }

        .overlay {
            background-color: rgba(0, 0, 0, 0.5);
            padding: 40px;
            border-radius: 12px;
            max-width: 700px;
            text-align: center;
        }

        .intro-text h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .intro-text p {
            font-size: 20px;
        }

        .content {
            padding: 20px;
        }

        .recommendation-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin: 20px 0;
            padding: 15px;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .recommendation-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }

        .recommendation-card h3 {
            margin: 10px 0;
            font-size: 20px;
            color: #333;
        }

        .recommendation-card p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }

        .recommendation-card p.local-time {
            font-size: 14px;
            color: #555;
            margin: 5px 0;
        }

        .visit-button {
            background-color: #0077cc;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            align-self: flex-start;
        }

        .visit-button:hover {
            background-color: #005fa3;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <div class="navbar-links">
            <a href="travel_recommendation.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
            <div class="social-icons">
                <a href="#"><i class="fab fa-facebook"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search destinations...">
            <button id="searchButton">Search</button>
            <button id="resetButton">Clear</button>
        </div>
    </div>

    <!-- Home Page Content -->
    <div class="home-section">
        <div class="overlay">
            <div class="intro-text">
                <h1>Welcome to Travel Explorer</h1>
                <p>Your one-stop destination for discovering the most beautiful places around the world. From bustling cities to serene beaches and ancient temples, we’ve got the best recommendations just for you!</p>
            </div>
        </div>
    </div>

    <div class="content">
        <h2>Recommended Places</h2>
        <div id="results"></div> <!-- Kết quả sẽ hiển thị ở đây -->
    </div>

    <script src="travel_recommendation.js"></script>

</body>
</html>
